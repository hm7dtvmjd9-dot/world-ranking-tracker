name: Update World Athletics Rankings

on:
  schedule:
    # Läuft jeden Mittwoch um 18:30 Uhr UTC (ca. 19:30 bzw. 20:30 Uhr deutscher Zeit)
    - cron: '30 18 * * 3'
  workflow_dispatch: # Ermöglicht dir, das Skript jederzeit manuell per Klick zu testen

permissions:
  contents: write # Erlaubt GitHub Actions, die neue JSON-Datei ins Repo zu pushen

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests

      - name: Ranking-Scraper ausführen
        run: |
          python scraper.py

      - name: Neue Daten committen und pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ranking_latest.json
          git commit -m "Automatisches Ranking-Update [skip ci]" || exit 0
          git push
