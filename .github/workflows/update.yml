name: Update World Athletics Rankings

on:
  schedule:
    # Jeden Mittwoch um 18:30 UTC
    - cron: '30 18 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Ranking-Scraper ausführen
        run: python scraper.py

      - name: Neue Daten committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ranking_latest.json
          git diff-index --quiet HEAD || git commit -m "Automatisches Ranking-Update [skip ci]"
          git push
